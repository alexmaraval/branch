[project]
name = "branch"
version = "0.1.0"
description = "A tiny local chat app that branches conversations into a tree."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "ruff>=0.9.2",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "web", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
