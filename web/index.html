<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branch - Chat Tree</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="brand">branch</div>
            <div class="subtitle">Chat tree explorer</div>
          </div>
          <div id="currentBranch" class="current-branch"></div>
        </div>
        <details class="sidebar-settings">
          <summary>LLM Settings</summary>
          <div class="field">
            <label for="apiKey">API Key</label>
            <input
              id="apiKey"
              type="password"
              placeholder="sk-..."
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="model">Model</label>
            <input
              id="model"
              list="model-list"
              placeholder="gpt-4o-mini"
              value="gpt-4o-mini"
            />
            <datalist id="model-list">
              <option value="gpt-4o-mini"></option>
              <option value="gpt-4.1-mini"></option>
              <option value="gpt-4.1"></option>
            </datalist>
          </div>
        </details>
        <div class="sidebar-tools">
          <button id="renameBtn" class="btn accent subtle">Rename</button>
          <button id="deleteBtn" class="btn outline">Delete</button>
          <button id="branchBtn" class="btn accent">Branch</button>
        </div>
        <div class="tree-wrap">
          <div id="tree" class="tree"></div>
        </div>
        <div class="sidebar-actions">
          <button id="exportBtn" class="btn ghost">Export JSON</button>
          <button id="importBtn" class="btn ghost">Import JSON</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </aside>

      <main class="main">
        <header class="topbar"></header>

        <section id="chat" class="chat"></section>

        <footer class="composer">
          <textarea
            id="userInput"
            rows="3"
            placeholder="Type your message..."
          ></textarea>
          <button id="sendBtn" class="send-fab" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="send-icon">
              <path
                d="M12 4l6.5 6.5-1.4 1.4L13 7.8V20h-2V7.8l-4.1 4.1-1.4-1.4L12 4z"
                fill="currentColor"
              />
            </svg>
          </button>
          <div class="composer-actions">
            <div id="status" class="status"></div>
          </div>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </body>
</html>
