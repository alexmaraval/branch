<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branch - Chat Tree</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="brand">branch</div>
            <div class="subtitle">Chat tree explorer</div>
          </div>
          <button
            id="sidebarToggle"
            class="sidebar-toggle"
            aria-label="Toggle sidebar"
          >
            ☰
          </button>
        </div>
        <details class="sidebar-settings">
          <summary>LLM Settings</summary>
          <div class="field">
            <label for="apiKey">API Key</label>
            <input
              id="apiKey"
              type="password"
              placeholder="sk-..."
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="model">Model</label>
            <input
              id="model"
              list="model-list"
              placeholder="gpt-4o-mini"
              value="gpt-4o-mini"
            />
            <datalist id="model-list">
              <option value="gpt-4o-mini"></option>
              <option value="gpt-4.1-mini"></option>
              <option value="gpt-4.1"></option>
            </datalist>
          </div>
        </details>
        <div class="tree-wrap">
          <div id="tree" class="tree"></div>
        </div>
        <div class="sidebar-actions">
          <button id="exportBtn" class="btn ghost">Export JSON</button>
          <button id="importBtn" class="btn ghost">Import JSON</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </aside>
      <div id="sidebarResizer" class="sidebar-resizer" aria-hidden="true"></div>

      <main class="main">
        <header class="topbar"></header>

        <section id="chat" class="chat"></section>

        <footer class="composer">
          <div class="composer-main">
            <div class="composer-input-wrap">
              <textarea
                id="userInput"
                rows="3"
                placeholder="Type your message..."
              ></textarea>
              <div class="composer-actions" aria-label="Chat actions">
                <button
                  id="branchBtn"
                  class="round-action branch"
                  aria-label="Branch chat"
                >
                  <svg viewBox="0 0 16 16" aria-hidden="true" class="action-icon">
                    <path
                      fill-rule="evenodd"
                      d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.492 2.492 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
                <button
                  id="deleteBtn"
                  class="round-action delete"
                  aria-label="Delete branch"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="action-icon">
                    <path
                      d="M7 7l10 10M17 7L7 17"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.4"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
                <button id="sendBtn" class="round-action send" aria-label="Send">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="action-icon">
                    <path
                      d="M12 4l6.5 6.5-1.4 1.4L13 7.8V20h-2V7.8l-4.1 4.1-1.4-1.4L12 4z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="composer-meta">
              <div id="currentBranch" class="current-branch inline"></div>
              <div id="status" class="status"></div>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </body>
</html>
